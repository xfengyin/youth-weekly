name: Gemini Issue Triage

# 用 Gemini CLI 对新 Issue 自动分类并打标签
on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Run Gemini Issue Triage
        uses: google-github-actions/run-gemini-cli@v0.1.22
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            这是仓库的一个新 Issue（#${{ github.event.issue.number }}，标题： ${{ github.event.issue.title }}）。
            使用 GitHub 工具阅读其标题与正文，判断类型，并从下列标签中挑选最贴切的 1-3 个：
            bug, enhancement, documentation, security, question, dependencies, ci-cd, performance
            然后用 GitHub 工具给该 Issue 添加对应标签，并写一句中文分类说明作为评论。
