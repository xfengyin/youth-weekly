name: Weekly Auto-Publish

on:
  schedule:
    # 每周一 UTC 13:00 (北京时间 21:00) 自动采集并发布
    - cron: '0 13 * * 1'
  workflow_dispatch:
    inputs:
      reason:
        description: '手动触发原因'
        required: false
        default: '手动触发周刊采集与发布'

# 最小化权限：
# - contents: write：提交并推送新一期
# - actions: write：用 GITHUB_TOKEN 显式触发 deploy.yml（GITHUB_TOKEN 的 push 不会自动触发其他 workflow）
permissions:
  contents: write
  actions: write

# 并发控制：与 deploy.yml 使用不同的 group 名，互不阻塞；
# 周刊生成原子性：同 workflow 下串行进行，新运行不打断旧运行。
concurrency:
  group: "weekly-publish-${{ github.workflow }}"
  cancel-in-progress: false  # 周刊生成不可打断

jobs:
  weekly-publish:
    name: Weekly Auto-Publish
    runs-on: ubuntu-24.04
    # 60min：采集（10+ 源 × 2s 间隔）+ LLM 杂志化改写（单条最长 60s × 3 重试 × ~25 条）
    # 的最坏情况评估，避免整周发布在 30min 超时失败
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4  # action 保持 @v4 大版本；uv 工具版本固定
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "scripts/uv.lock"

      - name: Install Python dependencies
        working-directory: scripts
        run: |
          uv sync --frozen

      - name: Ensure output directories exist
        run: |
          mkdir -p scripts/dist

      # 1. 采集阶段
      # 通过根目录 Makefile 的 collect 目标执行（仓库根运行；make 在 ubuntu runner 预装）。
      # step 级 env 会透传给 make 子进程，供 LLM 采集/改写使用。
      # 命令链与 docs/PUBLISHING_RUNBOOK.md §3 对齐。
      - name: Collect content from sources
        id: collect
        env:
          YOUTH_WEEKLY_LLM_API_KEY: ${{ secrets.YOUTH_WEEKLY_LLM_API_KEY }}
        run: |
          make collect

      - name: Check if collected content exists
        id: content_check
        run: |
          if [ -f scripts/.curated_content.json ]; then
            echo "has_content=true" >> $GITHUB_OUTPUT
          else
            echo "has_content=false" >> $GITHUB_OUTPUT
          fi

      # 2. 生成阶段（make issue）
      - name: Generate new weekly issue
        id: generate
        if: steps.content_check.outputs.has_content == 'true'
        env:
          YOUTH_WEEKLY_LLM_API_KEY: ${{ secrets.YOUTH_WEEKLY_LLM_API_KEY }}
        run: |
          make issue

      # 2.5 同步 README/docs 索引 + 重新生成站点 JSON 产物 + 校验
      #（make update-readme generate validate：等价于 Runbook 第③步 + 第④步自动门禁）
      - name: Sync README and regenerate artifacts
        id: sync
        if: steps.content_check.outputs.has_content == 'true'
        run: |
          make update-readme generate validate

      # 3. 提交阶段：将新一期推送到 main
      #    注意：commit message **不再带 [skip ci]**；但 GITHUB_TOKEN push 不会触发
      #    其他 workflow（GitHub 防递归机制），所以部署由下方
      #    "Trigger deploy workflow" 步骤显式 dispatch 触发。
      # 注：已移除旧的 published 翻转步骤——issue_generator 的 _build_frontmatter
      # 固定写入 published: true（生成即发布）。旧逻辑（grep 翻转 + cover/期号护栏）
      # 与生成器契约矛盾且护栏失效（issue_num>=7 会误发布历史草稿），由 t9 集成验证移除。
      # 如需引入人工审核流程，应在 issue_generator 侧用配置控制，而非在 workflow 翻转。
      - name: Commit generated issue
        id: commit
        if: steps.content_check.outputs.has_content == 'true'
        run: |
          git config user.email "action@github.com"
          git config user.name "青年周刊编辑部"
          # 同步新一期内容 + 自动更新的 README/索引 + 重新生成的站点 JSON 产物
          git add docs/ web/public/ README.md
          if git diff --staged --quiet; then
            echo "no_changes=true" >> $GITHUB_OUTPUT
          else
            git commit -m "📰 自动生成新一期周刊"
            git push
            echo "no_changes=false" >> $GITHUB_OUTPUT
          fi

      # 3.5 显式触发部署
      # GITHUB_TOKEN 的 push 不会触发其他 workflow（GitHub 防递归机制），
      # 所以必须在提交后显式调用 deploy.yml 的 workflow_dispatch。
      - name: Trigger deploy workflow
        if: steps.commit.outputs.no_changes == 'false'
        run: |
          curl -sS -f -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}'

      # 4. 汇总结果
      - name: Notify result
        if: always()
        run: |
          if [ "${{ steps.collect.outcome }}" = "failure" ]; then
            echo "❌ Content collection failed; check the 'Collect content from sources' step logs"
            exit 1
          elif [ "${{ steps.content_check.outputs.has_content }}" = "false" ]; then
            echo "⚠️ No curated content available, skipping issue generation"
          elif [ "${{ steps.commit.outputs.no_changes }}" = "true" ]; then
            echo "ℹ️ No new content to publish this week"
          else
            echo "✅ New weekly issue published; deploy workflow has been explicitly triggered"
          fi
