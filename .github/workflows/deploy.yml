# =============================================================================
# Pages 部署说明（消除双轨冲突）
# -----------------------------------------------------------------------------
# 1) 仓库 Settings → Pages → Build and deployment → Source
#    必须选择 "GitHub Actions"（而不是 "Deploy from a branch"）。
#    选择 "GitHub Actions" 后，GitHub 内置的 pages-build-deployment workflow
#    不会再与本文件并发运行，从根本上消除双轨冲突。
# 2) 首次启用时需仓库管理员在 Settings → Pages 中手动点击启用；
#    GITHUB_TOKEN 没有 admin:repo / admin:org 权限，无法自动开启 Pages。
# 3) 本 workflow 不绑定 environment：避免 environment 保护规则（如 required
#    reviewers、wait timer）阻塞部署，保留已验证通过的轻量部署链路。
# 4) 并发控制 group: pages-deploy-${{ workflow }}-${{ ref }}
#    - 同 workflow + 同 ref 下，新运行会取消旧运行，避免竞态。
#    - 与 weekly-publish 使用不同的 group 名，互不阻塞。
# =============================================================================
name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 最小化权限：仅授予 Pages 部署所需的最小权限
# 注意：GITHUB_TOKEN 无法启用 Pages，需在仓库设置中手动启用
permissions:
  contents: read
  pages: write
  id-token: write

# 并发控制：同 workflow+ref 下只允许一个 deploy 运行，
# 避免多次部署互相覆盖或抢资源；新运行取消旧运行。
concurrency:
  group: "pages-deploy-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build & Upload Artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4  # action 保持 @v4 大版本；uv 工具版本固定
        with:
          version: '0.12.5'
          enable-cache: true
          cache-dependency-glob: "scripts/uv.lock"

      - name: Install dependencies
        run: |
          cd web
          npm ci --no-fund
          cd ../scripts
          uv sync --no-dev

      - name: Generate content
        run: |
          cd scripts
          # rss 已在 generate 默认白名单内（cli.py），无需单独执行
          uv run youth-weekly generate

      - name: Verify T-B artifacts in web/public
        run: |
          # T-B 管线（t5）的 generate 直接把站点 JSON 产物写进 web/public/，
          # Next.js 静态导出会自动复制进 out/。这里做契约硬校验：缺失即 fail。
          for f in search-data.json issue_index.json site-data.json; do
            test -f "web/public/$f" || { echo "❌ web/public/$f 缺失（generate 未产出，契约被破坏）"; exit 1; }
            echo "✔ web/public/$f"
          done
          if ls web/public/issue-*.json >/dev/null 2>&1; then
            echo "✔ web/public/issue-*.json（$(ls web/public/issue-*.json | wc -l) 个）"
          else
            echo "❌ web/public/issue-*.json 缺失（generate 未产出单期 JSON）"
            exit 1
          fi
          test -f "web/public/_headers" || { echo "❌ web/public/_headers 缺失"; exit 1; }

      - name: Build site
        run: |
          cd web
          npm run build

      - name: Prepare deployment artifact
        id: prepare
        run: |
          # 清理旧产物，避免污染
          rm -rf output
          mkdir -p output

          # 优先使用 Next.js 静态导出（next.config.js 中 output: 'export'）
          if [ -d "web/out" ] && [ -f "web/out/index.html" ]; then
            echo "📦 Using Next.js static export (web/out)"
            cp -r web/out/. output/
          else
            echo "❌ Build output not found or invalid: web/out/index.html missing"
            echo "---- web/out contents ----"
            ls -la web/out 2>&1 || echo "(no web/out directory)"
            exit 1
          fi

          # 同步周刊正文图片资产：docs/issues/<slug>/assets -> output/issues/<slug>/assets
          # 正文 Markdown 用相对路径（如 ./assets/city-night.jpg），页面 URL 为
          # /youth-weekly/issues/<slug>/，故图片必须落在同目录的 assets/ 下。
          # web/out 中无 issues/ 目录，不会覆盖冲突；无 assets 目录的期次自动跳过。
          asset_count=0
          for dir in docs/issues/*/assets; do
            [ -d "$dir" ] || continue
            slug=$(basename "$(dirname "$dir")")
            mkdir -p "output/issues/$slug/assets"
            cp -r "$dir/." "output/issues/$slug/assets/"
            n=$(find "$dir" -type f | wc -l)
            asset_count=$((asset_count + n))
            echo "📁 Synced $slug/assets ($n files)"
          done
          echo "✔ issues assets synced: $asset_count files total"

          # 复制 RSS 文件到网站根目录（generate 的 rss 插件默认输出 scripts/dist/rss.xml）
          if [ -f "scripts/dist/rss.xml" ]; then
            echo "📰 Copying RSS feed"
            cp scripts/dist/rss.xml output/rss.xml
          else
            echo "❌ scripts/dist/rss.xml 缺失（rss 插件未产出）"
            exit 1
          fi

          # 关键：禁用 Jekyll，否则以 _ 开头的文件（如 _next）会被忽略
          touch output/.nojekyll

          echo "artifact_ready=true" >> $GITHUB_OUTPUT

      - name: Verify deployment artifact
        run: |
          # 必需产物：站点入口 / RSS / 搜索数据 / 索引 / 站点元数据 / 单期 JSON / 安全头
          test -f "output/index.html" || { echo "❌ output/index.html missing"; exit 1; }
          test -f "output/rss.xml" || { echo "❌ output/rss.xml missing"; exit 1; }
          test -f "output/search-data.json" || { echo "❌ output/search-data.json missing（搜索页依赖）"; exit 1; }
          test -f "output/issue_index.json" || { echo "❌ output/issue_index.json missing"; exit 1; }
          test -f "output/site-data.json" || { echo "❌ output/site-data.json missing"; exit 1; }
          if ls output/issue-*.json >/dev/null 2>&1; then
            echo "✔ output/issue-*.json（$(ls output/issue-*.json | wc -l) 个）"
          else
            echo "❌ output/issue-*.json 缺失"
            exit 1
          fi
          test -f "output/_headers" || { echo "❌ output/_headers 缺失（安全响应头未随部署）"; exit 1; }
          # 周刊图片资产硬校验：至少一个期次的封面已随部署复制（T-M 资产同步）
          test -f "output/issues/001/assets/cover.png" || { echo "❌ output/issues/001/assets/cover.png 缺失（assets 同步失败）"; exit 1; }
          asset_total=$(find output/issues -type f 2>/dev/null | wc -l)
          echo "✔ issues assets: $asset_total files under output/issues/"
          echo "✅ Verification passed: $(find output -type f | wc -l) files ready"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 10
    # deploy-pages v4 要求绑定 github-pages environment；
    # 若仓库未配置 protection rules，绑定 environment 不会阻塞自动部署。
    environment:
      name: github-pages

    steps:
      # 配置 Pages（不传 enablement，因为 GITHUB_TOKEN 无 admin 权限）
      # 若 Pages 未启用，此步骤会失败，需用户先在仓库设置中启用
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
