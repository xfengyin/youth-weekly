version: 2
updates:
  # Python 依赖（uv）
  - package-ecosystem: "pip"
    directory: "/scripts"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    # 注：原 reviewers 引用的团队 "youth-weekly/maintainers" 无法确认存在，
    # 改为仓库维护者用户名，避免 Dependabot 无法指派 reviewer。
    reviewers:
      - "xfengyin"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    reviewers:
      - "xfengyin"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"

  # 前端依赖（npm）
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    reviewers:
      - "xfengyin"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore"
      include: "scope"
    # 分组：同一套库的 minor/patch 合成一个 PR，避免版本错配
    # （如 react 19.3 与 react-dom 19.2 各自升级后卡住）；major 仍单独开 PR 人工评估。
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "minor"
          - "patch"
      next:
        patterns:
          - "next"
          - "eslint-config-next"
        update-types:
          - "minor"
          - "patch"
      testing:
        patterns:
          - "jest"
          - "jest-environment-jsdom"
          - "ts-jest"
          - "@types/jest"
          - "@testing-library/*"
        update-types:
          - "minor"
          - "patch"
    # 暂时忽略 ESLint 10（2026-09 复核）：eslint-config-next 16.3.x 仍把 parser 指向
    # Next 自带的 babel parser（next/dist/compiled/babel），该 parser 内置的 eslint-scope
    # 还是 8.x 时代实现，缺少 ESLint 10 新增要求的 ScopeManager#addGlobals，
    # lint 会以 TypeError: scopeManager.addGlobals is not a function 失败。
    # 等 Next 更新该 parser（或 eslint-config-next 换掉它）后，删掉下面这段即可恢复接收升级。
    ignore:
      - dependency-name: "eslint"
        versions: [">= 10.0.0"]
