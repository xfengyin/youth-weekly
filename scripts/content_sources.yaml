# 源分类的采集阈值(仅控制采集/策展数量,板块展示由 config.yaml#categories 决定)
# 每个展示板块都必须至少有一个 source_category 映射到它（见 expander.py）
source_categories:
  tech:  # → 板块「科技新势力」
    id: tech
    min_items: 3
    max_items: 5

  dev:  # → 板块「好工具」
    id: dev
    min_items: 3
    max_items: 5

  ai:  # → 板块「科技新势力」
    id: ai
    min_items: 3
    max_items: 5

  research:  # → 板块「科技新势力」
    id: research
    min_items: 2
    max_items: 4

  oss:  # → 板块「好工具」
    id: oss
    min_items: 2
    max_items: 4

  anime:  # → 板块「二次元次元壁」
    id: anime
    min_items: 2
    max_items: 4

  gaming:  # → 板块「游戏研究所」
    id: gaming
    min_items: 2
    max_items: 4

  stories:  # → 板块「青春故事会」
    id: stories
    min_items: 2
    max_items: 4

  watching:  # → 板块「在看什么」
    id: watching
    min_items: 2
    max_items: 4

  gallery:  # → 板块「一周图鉴」
    id: gallery
    min_items: 2
    max_items: 4

  jobs:  # → 板块「谁在招人」
    id: jobs
    min_items: 2
    max_items: 4

# 去重配置
dedup:
  # 使用 URL 的 MD5 指纹去重
  enabled: true
  # 去重数据库文件路径
  db_path: "scripts/.content_dedup.db"
  # 保留天数
  retention_days: 30

# 采集配置
collection:
  # HTTP 请求超时（秒）
  timeout: 30
  # 每源最大重试次数
  max_retries: 3
  # 请求间隔（秒），防止被封；collect 插件在源之间真实 sleep
  delay_between_sources: 2
  # 单个源可通过 `delay: <秒>` 字段覆盖此值（0 表示该源不等待）
  # 注：新增中文/独立源普遍设置 delay: 0（不同站点无共享限流），
  #     保留默认 2s 用于 HackerNews/GitHub 等有明确限流的源。
  # User-Agent
  user_agent: "YouthWeekly/1.0 (Content Aggregator)"
